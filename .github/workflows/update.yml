name: Update reviewed routing lists
on:
  workflow_dispatch:
  schedule:
    # 04:17 Asia/Tokyo. GitHub may delay scheduled jobs.
    - cron: '17 19 * * *'
  push:
    paths:
      - 'policy/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-reviewed-routing-lists
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test filtering before fetching
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Fetch, filter and validate
        run: python3 scripts/update_rules.py
      - name: Check published scope
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Publish only the two lists and their status
        run: |
          git add -- rules/ads.list rules/direct.list rules/status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh reviewed routing lists'
          git push
